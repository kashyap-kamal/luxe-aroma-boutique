name: CI and Hostinger Deploy

on:
  pull_request:
    branches:
      - main
      - feat/stitch-redesign
  push:
    branches:
      - main
      - feat/stitch-redesign
  schedule:
    # 03:00 IST daily static SEO and sitemap refresh
    - cron: "30 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aromeluxe-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Typecheck, Test, and Static Export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Unit and regression tests
        run: npm test

      - name: Build static export
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL || 'https://bzqwezglotpkzxghjxvc.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'public-anon-placeholder' }}
          NEXT_PUBLIC_CASHFREE_ENVIRONMENT: production
          NEXT_PUBLIC_APP_URL: https://aromeluxe.in
        run: |
          npm run build
          cp .htaccess out/.htaccess
          test -f out/index.html
          test -f out/.htaccess

      - name: Upload static export artifact
        uses: actions/upload-artifact@v4
        with:
          name: aromeluxe-static-out
          path: out/
          include-hidden-files: true
          retention-days: 7

  deploy-hostinger:
    name: Deploy to Hostinger (aromeluxe.in)
    needs: verify-and-build
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' ||
       github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Download static export artifact
        uses: actions/download-artifact@v4
        with:
          name: aromeluxe-static-out
          path: out/

      - name: Check Hostinger FTP secrets
        id: check_ftp
        env:
          FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: |
          if [ -n "$FTP_SERVER" ] && [ -n "$FTP_USERNAME" ] && [ -n "$FTP_PASSWORD" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Hostinger FTP secrets not configured yet. Skipping live upload."
          fi

      - name: Upload out/ to Hostinger public_html
        if: steps.check_ftp.outputs.configured == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: ${{ vars.HOSTINGER_SERVER_DIR || './public_html/' }}
          dangerous-clean-slate: false
